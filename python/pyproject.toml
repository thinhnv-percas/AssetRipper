[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetripper-python"
version = "0.1.0"
description = "Python port of AssetRipper, ported package by package from Source/*.csproj"
requires-python = ">=3.11"
dependencies = ["flask>=3", "lz4>=4", "xxhash>=3", "texture2ddecoder>=1", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
assetripper-inspect = "assetripper_cli.cli:main"
assetripper-gui-web = "assetripper_gui_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetripper_gui_web = ["templates/**/*.html", "static/**/*"]
assetripper_export_modules = ["shaders/templates/*.json", "shaders/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
