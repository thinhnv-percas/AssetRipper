[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetripper-python"
version = "0.1.0"
description = "Python port of AssetRipper, ported package by package from Source/*.csproj"
requires-python = ">=3.11"
# `fsb5` decodes Unity/FMOD FSB5 audio containers into real .wav/.ogg files (the equivalent of
# upstream AssetRipper's Fmod5Sharp dependency). Vorbis-mode clips additionally need the
# native libvorbis library at runtime, which pip cannot provide -- install it via the system
# package manager (Debian/Ubuntu: `libvorbis0a`; Fedora: `libvorbis`; macOS: `brew install
# libvorbis`). Without it, Vorbis clips fall back to a raw .fsb dump with a logged warning
# rather than failing the export -- see assetripper_export_modules/audio_clip_decoder.py.
dependencies = [
    "flask>=3",
    "lz4>=4",
    "xxhash>=3",
    "texture2ddecoder>=1",
    "Pillow>=10",
    "brotli>=1.1",
    "zstandard>=0.22",
    # FSB5/FMOD audio containers. Vorbis-mode clips additionally need the *native* libvorbis
    # library at runtime, which is not pip-installable:
    #   Debian/Ubuntu: apt install libvorbis0a
    #   Fedora:        dnf install libvorbis
    #   macOS:         brew install libvorbis
    # Without it, Vorbis clips fall back to a raw .fsb dump with a logged warning; PCM-mode
    # clips need nothing extra. See assetripper_export_modules/audio_clip_decoder.py.
    "fsb5>=1",
    # Decodes Ogg Vorbis for AudioExportFormat.PreferWav. Its wheels bundle libsndfile, which
    # has had Ogg Vorbis support since 1.0.29, so this one needs no system package -- and it is
    # only used by PreferWav, so a broken install degrades to .ogg rather than failing exports.
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
assetripper-inspect = "assetripper_cli.cli:main"
assetripper-gui-web = "assetripper_gui_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetripper_gui_web = ["templates/**/*.html", "static/**/*"]
assetripper_export_modules = ["shaders/templates/*.json", "shaders/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
