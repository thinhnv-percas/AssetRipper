<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AssetRipper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home.index') }}">AssetRipper</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('home.index') }}">Home</a>
        <a class="nav-link" href="{{ url_for('home.commands') }}">Commands</a>
        <a class="nav-link" href="{{ url_for('home.settings') }}">Settings</a>
        <a class="nav-link" href="{{ url_for('home.configuration_files') }}">Configuration Files</a>
        <a class="nav-link" href="{{ url_for('home.licenses') }}">Licenses</a>
        <a class="nav-link" href="{{ url_for('home.privacy') }}">Privacy</a>
      </div>
    </div>
  </nav>
  <main class="container-fluid">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-warning py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
